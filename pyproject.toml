[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelforge-analysis"
version = "0.1.0"
description = "Analytical model and reporting tools for KernelForge CUDA benchmarks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Library baselines the hand-written CUDA kernel is compared against.
# torch is pinned because the comparison table quotes its version; a silent
# minor bump can change inductor's fusion decisions and therefore the numbers.
# triton is only installed on Linux -- upstream publishes manylinux wheels
# exclusively, so the Triton row is Linux+GPU only by construction, not by
# choice. torch >=2.4 is the floor for torch.nn.functional.rms_norm.
baseline = [
    "torch==2.13.0",
    "numpy>=2,<3",
    "triton==3.7.1; platform_system == 'Linux'",
]

[project.scripts]
kernelforge-analysis = "kernelforge.cli:main"
kernelforge-matrix = "kernelforge.matrix:main"
kernelforge-compare = "kernelforge.compare:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# `line-length` above is inert without this. Ruff's default rule set is
# ["E4", "E7", "E9", "F"], which omits E501 (line-too-long) entirely, so the
# declared 100-column limit was documentation rather than enforcement -- a
# 103-character line in tests/test_baselines.py passed `ruff check` cleanly.
# extend-select keeps the defaults and adds the one rule that makes
# line-length mean something.
extend-select = ["E501"]

[tool.ruff.lint.isort]
# `kernelforge` lives under python/, which ruff's src heuristics do not infer,
# so without this it is classified third-party and every test's import block is
# reported as unsorted (a pre-existing finding on newer ruff, not new here).
known-first-party = ["kernelforge"]
